<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇩🇪</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deutsch Verben Meister — master German verb conjugation with spaced repetition." />
    <title>Deutsch Verben Meister</title>
    <!-- Resolve the theme before first paint so there is no light flash. -->
    <script>
      var t;
      try {
        t = JSON.parse(localStorage.getItem('dvm.settings.v1')).state.theme;
      } catch (e) {}
      document.documentElement.dataset.theme =
        t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

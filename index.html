<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇩🇪</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deutsch Verben Meister — master German verb conjugation with spaced repetition." />
    <meta name="theme-color" content="#f6fbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#143844" media="(prefers-color-scheme: dark)" />
    <title>Deutsch Verben Meister</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://verben.deulern.com/" />
    <meta property="og:title" content="Deutsch Verben Meister" />
    <meta property="og:description" content="Master German verb conjugation with spaced repetition, from A1 to B1." />
    <meta property="og:image" content="https://verben.deulern.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Resolve the theme before first paint so there is no light flash. -->
    <script>
      var t;
      try {
        t = JSON.parse(localStorage.getItem('dvm.settings.v1')).state.theme;
      } catch (e) {}
      document.documentElement.dataset.theme =
        t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
